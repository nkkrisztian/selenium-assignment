# Test Runner Settings

# Options: 
# - pubilc: connect to https://parabank.parasoft.com
# - local: connect to the containerized version of the web app running on localhost
env=public

# Browser Settings
browser.headless=true

# Failure Screenshots Directory
directory.screenshots=build/reports/tests/test/failed/screenshots

# Base Domains
domain.public=https://parabank.parasoft.com
domain.local=http://parabank:8080

# Relative Paths
path.home=/parabank/index.htm
path.admin=/parabank/admin.htm

# Selenium URL
selenium.hub.url=http://selenium:4444/wd/hub
